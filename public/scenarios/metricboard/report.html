<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetricBoard — Report</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    nav { background: #1e293b; padding: 1rem 2rem; display: flex; gap: 2rem; align-items: center; }
    nav .brand { color: #38bdf8; font-weight: 700; font-size: 1.2rem; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    .report { max-width: 960px; margin: 2rem auto; padding: 0 2rem; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .report-header h1 { font-size: 1.5rem; }
    .last-updated { font-size: 0.8rem; color: #64748b; }
    .filter-bar { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
    .filter-bar label { font-size: 0.85rem; color: #94a3b8; }
    .filter-dropdown { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.9rem; }
    .filter-dropdown:disabled { opacity: 0.4; cursor: not-allowed; }
    .data-table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    .data-table td { padding: 0.75rem 1rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .data-table tr:first-child td { font-weight: 600; color: #94a3b8; background: #0f172a; }
    .data-table tr:last-child td { border-bottom: none; }
    footer { text-align: center; color: #475569; font-size: 0.75rem; padding: 2rem; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">MetricBoard</span>
    <a href="overview.html">Overview</a>
    <a href="report.html">Report</a>
    <a href="export.html">Export</a>
  </nav>
  <section class="report">
    <div class="report-header">
      <h1>Revenue Report</h1>
      <span class="last-updated">Last updated: Jan 2024</span>
    </div>
    <div class="filter-bar">
      <label for="region">Filter by region:</label>
      <select id="region" class="filter-dropdown" disabled>
        <option>All regions</option>
        <option>North America</option>
        <option>Europe</option>
        <option>Asia Pacific</option>
      </select>
    </div>
    <table class="data-table">
      <tr><td>Region</td><td>Q1</td><td>Q2</td><td>Q3</td><td>Total</td></tr>
      <tr><td>North America</td><td>$42,000</td><td>$58,000</td><td>$71,000</td><td>$171,000</td></tr>
      <tr><td>Europe</td><td>$28,000</td><td>$35,000</td><td>$41,000</td><td>$104,000</td></tr>
      <tr><td>Asia Pacific</td><td>$15,000</td><td>$22,000</td><td>$30,000</td><td>$67,000</td></tr>
      <tr><td style="font-weight:700;">Total</td><td style="font-weight:700;">$85,000</td><td style="font-weight:700;">$115,000</td><td style="font-weight:700;">$142,000</td><td style="font-weight:700;">$342,000</td></tr>
    </table>
  </section>
  <footer>&copy; 2025 MetricBoard Analytics</footer>
</body>
</html>
