<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase — Checkout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    nav { background: #1e293b; padding: 1rem 2rem; display: flex; gap: 2rem; align-items: center; }
    nav .brand { color: #60a5fa; font-weight: 700; font-size: 1.2rem; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; }
    .checkout { max-width: 520px; margin: 2rem auto; padding: 0 2rem; }
    .checkout h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 0.3rem; }
    .form-group input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .summary { background: #f1f5f9; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .summary h2 { font-size: 1rem; margin-bottom: 0.75rem; }
    .summary-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.4rem; }
    .summary-total { border-top: 1px solid #cbd5e1; padding-top: 0.5rem; font-weight: 700; }
    .place-order { width: 100%; background: #3b82f6; color: white; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .place-order:disabled { opacity: 0.5; cursor: not-allowed; }
    footer { background: #f1f5f9; padding: 1.5rem; text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">ShopEase</span>
    <a href="listing.html">Products</a>
    <a href="detail.html">Featured</a>
    <a href="checkout.html">Cart (2)</a>
  </nav>
  <section class="checkout">
    <h1>Checkout</h1>
    <div class="form-group">
      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Jane Doe">
    </div>
    <div class="form-group">
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label for="address">Shipping address</label>
      <input type="text" id="address" placeholder="123 Main St, City, State">
    </div>
    <div class="summary">
      <h2>Order Summary</h2>
      <div class="summary-row"><span>Bluetooth Speaker × 3</span><span>$179.97</span></div>
      <div class="summary-row"><span>Shipping</span><span>Free</span></div>
      <div class="summary-row summary-total"><span>Total</span><span>$179.97</span></div>
    </div>
    <button class="place-order" disabled>Place Order</button>
  </section>
  <footer>&copy; 2025 ShopEase Inc. All rights reserved.</footer>
</body>
</html>
